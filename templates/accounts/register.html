{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<div class="card">
  <form method="post" action="">
    {% csrf_token %}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field.errors }}
      {{ field }}
    {% endfor %}
    <div class="row">
      <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
      <a class="muted" href="{% url 'accounts:login' %}">Уже есть аккаунт? Вход</a>
    </div>
  </form>
</div>
{% endblock %}
