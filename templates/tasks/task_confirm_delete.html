{% extends "base.html" %}
{% block title %}Удаление задачи{% endblock %}
{% block content %}
<h1>Удалить задачу?</h1>
<div class="card">
  <p><strong>{{ object.title }}</strong></p>
  <p class="muted">Автор: {{ object.user.email }}</p>
  <form method="post" action="">
    {% csrf_token %}
    <div class="row">
      <button type="submit" class="btn btn-danger">Удалить</button>
      <a class="btn" href="{% url 'tasks:list' %}">Отмена</a>
    </div>
  </form>
</div>
{% endblock %}
